<!-- Vista del Formulario de Reservas -->
<div id="vistaFormulario" class="vista">
    <div class="glass-panel">
        <div class="content-header">
            <h1>Reservaciones</h1>
        </div>

        <!-- EL FORMULARIO DEBE TENER id="formReserva" -->
        <form id="formReserva">
            <div class="form-fila">
                <div class="form-grupo">
                    <label>Mes:</label>
                    <select id="mesReserva" class="select-fecha">
                        <option value="Enero">Enero</option>
                        <option value="Febrero">Febrero</option>
                        <option value="Marzo">Marzo</option>
                        <option value="Abril">Abril</option>
                        <option value="Mayo">Mayo</option>
                        <option value="Junio">Junio</option>
                        <option value="Julio">Julio</option>
                        <option value="Agosto">Agosto</option>
                        <option value="Septiembre">Septiembre</option>
                        <option value="Octubre">Octubre</option>
                        <option value="Noviembre" selected>Noviembre</option>
                        <option value="Diciembre">Diciembre</option>
                    </select>
                </div>
                <div class="form-grupo">
                    <label>Fecha de ingreso:</label>
                    <select id="fechaIngreso" class="select-fecha">
                        <!-- Se llena dinámicamente con JS -->
                    </select>
                </div>
                <div class="form-grupo">
                    <label>Fecha de salida:</label>
                    <select id="fechaSalida" class="select-fecha">
                        <!-- Se llena dinámicamente con JS -->
                    </select>
                </div>
            </div>

            <div class="form-grupo" style="margin-bottom: 15px;">
                <label>Nombre del cliente:</label>
                <div class="campo-editable">
                    <input type="text" id="nombreCliente" placeholder="Nombre del cliente">
                </div>
            </div>

            <div class="form-grupo" style="margin-bottom: 15px;">
                <label>Numero de telefono:</label>
                <div class="campo-editable">
                    <input type="text" id="telefonoCliente" placeholder="Teléfono">
                </div>
            </div>

            <div class="form-grupo" style="margin-bottom: 15px;">
                <label>Nombre de la mascota:</label>
                <div class="campo-editable">
                    <input type="text" id="nombreMascota" placeholder="Nombre de la mascota">
                </div>
            </div>

            <div class="form-fila">
                <div class="form-grupo">
                    <label>Edad:</label>
                    <div class="campo-editable">
                        <input type="text" id="edadMascota" placeholder="Edad">
                    </div>
                </div>
                <div class="form-grupo">
                    <label>Raza:</label>
                    <div class="campo-editable">
                        <input type="text" id="razaMascota" placeholder="Raza">
                    </div>
                </div>
            </div>

            <div class="form-acciones">
                <button type="button" id="btnCancelar" class="btn-secundario">Cancelación</button>
                <!-- EL BOTÓN DEBE SER type="submit" PARA ACTIVAR EL GUARDADO -->
                <button type="submit" class="btn-primario">Guardar reservacion</button>
            </div>
        </form>
    </div>
</div>

<!-- ========================================================================== -->
<!-- MODALES (Colócalos antes de cerrar el <body>) -->
<!-- ========================================================================== -->

<!-- Modal de Éxito -->
<div id="modalExito" class="modal-overlay">
    <div class="modal-box modal-box--exito">
        <h2>¡Éxito!</h2>
        <p>La reservación se ha guardado correctamente.</p>
        <button id="btnCerrarExito" class="btn-modal">Aceptar</button>
    </div>
</div>

<!-- Modal de Error (Fechas inválidas) -->
<div id="modalError" class="modal-overlay">
    <div class="modal-box modal-box--error">
        <h2>Atención</h2>
        <p>La fecha de salida no puede ser anterior a la de ingreso.</p>
        <button id="btnCerrarError" class="btn-modal">Entendido</button>
    </div>
</div>

<!-- Modal de Detalle / Eliminar Cita (Calendario) -->
<div id="modalDetalleCita" class="modal-overlay">
    <div class="modal-box">
        <h2>Detalles de la Cita</h2>
        <div id="contenidoDetalleCita" style="text-align: left; margin-bottom: 20px;">
            <!-- Contenido inyectado por JS -->
        </div>
        <div style="display: flex; justify-content: space-between; gap: 10px;">
            <button id="btnEliminarCita" class="btn-modal" style="background-color: #e71d36;">Eliminar Cita</button>
            <button id="btnCerrarDetalle" class="btn-modal" style="background-color: #607285;">Cerrar</button>
        </div>
    </div>
</div>t
