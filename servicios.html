<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare - Administración de Servicios</title>
    <link rel="stylesheet" href="css/layout-common.css">
    <link rel="stylesheet" href="css/servicios.css">
    <link rel="stylesheet" href="css/sidebar-common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- MENÚ LATERAL DEL ADMINISTRADOR -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-toggle" aria-label="Abrir/cerrar menú"><i class="fa-solid fa-bars"></i></button>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link"><span class="sidebar-icon"><i class="fa-solid fa-house"></i></span><span class="sidebar-label">Inicio</span></a>
                <a href="servicios.html" class="sidebar-link active"><span class="sidebar-icon"><i class="fa-solid fa-star"></i></span><span class="sidebar-label">Servicios</span></a>
                <a href="reservaciones.html" class="sidebar-link"><span class="sidebar-icon"><i class="fa-solid fa-calendar-days"></i></span><span class="sidebar-label">Reservas</span></a>
                <a href="mascotas.html" class="sidebar-link"><span class="sidebar-icon"><i class="fa-solid fa-paw"></i></span><span class="sidebar-label">Mascotas</span></a>
                <a href="ganancias.html" class="sidebar-link"><span class="sidebar-icon"><i class="fa-solid fa-wallet"></i></span><span class="sidebar-label">Ganancias</span></a>
            </nav>
            <a href="perfil.html" class="sidebar-admin">
                <span class="sidebar-icon"><img class="icono" src="img/usergenerall.png" alt=""></span>
                <span class="sidebar-label">Administrador</span>
            </a>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <div class="glass-panel">
                <header class="content-header">
                    <h2>Gestión de Servicios</h2>
                    <!-- BOTÓN PARA AGREGAR SERVICIO (Exclusivo del Administrador) -->
                    <button id="btnAgregarServicio" class="btn-primario">+ Agregar Servicio</button>
                </header>

                <!-- VISTA: CATÁLOGO DE SERVICIOS -->
                <section id="view-catalog" class="content-view">
                    <div class="services-list" id="services-container">
                        <!-- Las tarjetas se generan dinámicamente con JS -->
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- MODAL PARA AGREGAR / EDITAR SERVICIO -->
    <div id="modalServicio" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Nuevo Servicio</h2>
            <form id="formServicio">
                <div class="form-grupo" style="margin-bottom: 15px;">
                    <label>Nombre del servicio:</label>
                    <input type="text" id="nombreServicio" placeholder="Ej. Baño y Corte" required style="width: 100%; padding: 8px;">
                </div>
                <div class="form-grupo" style="margin-bottom: 15px;">
                    <label>Descripción:</label>
                    <textarea id="descServicio" placeholder="Descripción breve" style="width: 100%; padding: 8px;"></textarea>
                </div>
                <div class="form-grupo" style="margin-bottom: 15px;">
                    <label>Detalles (uno por línea):</label>
                    <textarea id="detallesServicio" placeholder="Baño con shampoo&#10;Corte de pelo&#10;Limpieza de oídos" style="width: 100%; padding: 8px;"></textarea>
                </div>
                <div class="form-grupo" style="margin-bottom: 15px;">
                    <label>Precios (Grande / Mediano / Chico):</label>
                    <input type="text" id="precioServicio" placeholder="Ej. 300 / 250 / 200" required style="width: 100%; padding: 8px;">
                </div>
                <div class="form-grupo" style="margin-bottom: 20px;">
                    <label>Imagen del servicio:</label>
                    <input type="file" id="imagenServicio" accept="image/*" style="width: 100%;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" id="btnCerrarModal" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-primario">Guardar Servicio</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/sidebar-common.js"></script>
    <script src="js/servicios.js"></script>
</body>
</html>
